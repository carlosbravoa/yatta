name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One in-flight run per branch; a newer push makes an older run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # The Rust tests compile the tauri crate, which links against these.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Parser and view tests
        run: npm test

      # Runs svelte-check and produces dist/. Both matter, and the order does:
      # with custom-protocol enabled tauri embeds the frontend at compile time,
      # so the Rust build below fails outright if dist/ is not already there.
      - name: Type-check and build the frontend
        run: npm run build

      # custom-protocol matches how the app is really built. Without it the
      # frontend is not embedded and the binary points at the dev server, so
      # testing the other configuration would miss that whole class of bug.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features custom-protocol

  snap:
    name: Snap (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          # Free native arm64 runners for public repositories -- a real build
          # rather than qemu emulation, which turns a 3-minute Rust compile
          # into the better part of an hour.
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          snapcraft-args: --build-for=${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: yatta-${{ matrix.platform }}
          path: ${{ steps.snapcraft.outputs.snap }}
          if-no-files-found: error

  windows:
    name: Windows installer
    needs: test
    # Built on Windows rather than cross-compiled: Tauri's NSIS bundling needs
    # Windows tooling, and cross-compiling to it from Linux is unsupported.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Separate cache from the Linux jobs; different target triple.
          key: windows

      - run: npm ci

      # No system dependencies to install: Windows uses the WebView2 runtime
      # rather than WebKitGTK, so there is no GTK stack to pull in.
      - name: Build the installer
        run: npm run tauri -- build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: yatta-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

# Publishing is deliberately not automated here, so a merge never ships to
# users on its own. The Windows installer is published as a GitHub Release by
# release.yml when a v* tag is pushed. Snaps go out by hand: download the
# artifact and run
#
#   snapcraft upload ./yatta_<version>_<arch>.snap --release=edge
#
# If that ever should be automated, add a job using snapcore/action-publish@v1
# with a SNAPCRAFT_STORE_CREDENTIALS secret from `snapcraft export-login`.

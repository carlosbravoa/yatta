name: Release

# Publishing stays a deliberate act: nothing here runs on a merge, only when a
# version tag is pushed. The tag is the release; CI already vetted the commit.
#
# The tag also chooses the risk. A plain tag (v1.2.3) goes to the Snap Store's
# stable channel; a pre-release tag (v1.2.3-rc1) goes to beta and marks the
# GitHub Release as a pre-release. That keeps a way to ship something for real
# without putting it in front of everyone.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      # Four files carry the version. A tag agreeing with one while another has
      # drifted would ship a snap whose version contradicts the release page.
      - id: v
        name: Check the tag against every file that carries the version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          fail=0
          check() {
            if [ "$2" != "$base" ]; then
              echo "::error::$1 says $2, tag says $base"
              fail=1
            fi
          }
          check package.json      "$(node -p 'require("./package.json").version')"
          check tauri.conf.json   "$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          check Cargo.toml        "$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -1)"
          check snapcraft.yaml    "$(sed -n "s/^version: '\(.*\)'$/\1/p" snap/snapcraft.yaml | head -1)"
          [ "$fail" = 0 ] || exit 1

          echo "version=$tag" >> "$GITHUB_OUTPUT"
          # A hyphen means -rc1, -beta.2 and the like.
          case "$tag" in *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
                         *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  windows:
    name: Windows installer
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows
      - run: npm ci
      - run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # The snap is the recommended route on Ubuntu, but it is not the only
      # Linux there is: an AppImage runs anywhere, and the deb serves Debian
      # users who would rather not install snapd.
      - run: npm run tauri -- build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  snap:
    name: Snap (${{ matrix.platform }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-24.04
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: snapcore/action-build@v1
        id: build
        with:
          snapcraft-args: --build-for=${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: snap-${{ matrix.platform }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: [check, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,linux}"
          merge-multiple: true
          path: dist

      # Snaps are deliberately not attached. Installing one from a file means
      # `snap install --dangerous`, which skips assertions and never
      # auto-updates -- worse than the store in every way it differs.
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          REPO: ${{ github.repository }}
        run: |
          args=(--title "yatta $GITHUB_REF_NAME" --generate-notes --repo "$REPO")
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${args[@]}" dist/*

          # Prepend install guidance to the generated notes, so the Snap Store
          # stays the headline route on Linux rather than one of three downloads
          # competing for attention. Kept on one line: an indented heredoc would
          # carry its indentation into the notes.
          preamble=$'### Install\n\n**Linux** \u2014 `snap install yatta` (recommended: auto-updates, confined), or download the `.AppImage` below and make it executable, or the `.deb`.\n\n**Windows** \u2014 download the `-setup.exe` below. It is unsigned, so SmartScreen will warn: choose *More info* then *Run anyway*.'
          body="$(gh release view "$GITHUB_REF_NAME" --repo "$REPO" --json body --jq .body)"
          printf '%s\n\n---\n\n%s\n' "$preamble" "$body" \
            | gh release edit "$GITHUB_REF_NAME" --repo "$REPO" --notes-file -

  snap-store:
    name: Snap Store
    needs: [check, snap]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: snap-*
          merge-multiple: true
          path: snaps

      # A plain tag goes to stable; a pre-release tag stops at beta. Both
      # architectures are published to the same channel.
      - name: Upload and release
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "::error::SNAPCRAFT_STORE_CREDENTIALS is not set; nothing was published to the store"
            exit 1
          fi
          sudo snap install snapcraft --classic
          channel=stable
          [ "$PRERELEASE" = "true" ] && channel=beta
          for f in snaps/*.snap; do
            echo "Uploading $f to $channel"
            snapcraft upload "$f" --release="$channel"
          done

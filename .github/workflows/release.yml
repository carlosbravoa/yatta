name: Release

# Publishing stays a deliberate act: nothing here runs on a merge, only when a
# version tag is pushed. The tag is the release; CI already vetted the commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the app's own version would ship an installer
      # whose "About" and filename contradict the release page. Fail early.
      - name: Check the tag matches tauri.conf.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(node -p 'require("./src-tauri/tauri.conf.json").version')"
          if [ "$tag" != "$conf" ]; then
            echo "tag v$tag does not match tauri.conf.json version $conf" >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Shares the cache with the Windows CI job.
          key: windows

      - run: npm ci

      - name: Build the installer
        run: npm run tauri -- build --bundles nsis

      # Windows has no store channel, so the GitHub Release is the download
      # page. Snaps are not attached: Linux users get them from the Snap Store.
      - name: Publish the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "yatta $GITHUB_REF_NAME" \
            --generate-notes \
            src-tauri/target/release/bundle/nsis/*.exe
